services:
  sync-api:
    build:
      context: .
      dockerfile: sync-api/Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
    # Published on release by .github/workflows/release-images.yml. The build:
    # block above still works — `docker compose build` overrides this locally.
    image: ${WAXFLOW_REGISTRY:-ghcr.io/rancur}/waxflow-api:${WAXFLOW_IMAGE_TAG:-${VERSION:-latest}}
    container_name: waxflow-api
    ports:
      - "8402:8402"
    volumes:
      - sync-data:/app/data
      # Mount your music library directory (e.g., /path/to/music/library)
      - ${MUSIC_HOST_PATH:-./music}:/music
      # - ./.git:/app/.git:ro  # Optional: mount for version info
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8400}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:8402/api/spotify/callback}
      - TIDARR_URL=${TIDARR_URL:-http://localhost:8484}  # optional: only for legacy Tidarr fallback
      - LEXICON_API_URL=${LEXICON_API_URL:-http://localhost:48624}
      # The bind mount above still points at the share ROOT so Plex path
      # translation (plex_music_container_prefix=/music) and existing
      # /music/Database/... file_path rows keep resolving. The LIBRARY root
      # is a subdirectory of it -- that is what the worker writes into.
      - MUSIC_LIBRARY_PATH=${MUSIC_LIBRARY_PATH:-/music/Database}
      - SLS_DB_PATH=/app/data/sync.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8402/api/admin/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sync-worker:
    build:
      context: ./sync-worker
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
    image: ${WAXFLOW_REGISTRY:-ghcr.io/rancur}/waxflow-worker:${WAXFLOW_IMAGE_TAG:-${VERSION:-latest}}
    container_name: waxflow-worker
    ports:
      - "8403:8403"
    volumes:
      - sync-data:/app/data
      # Mount your music library directory (same as sync-api)
      - ${MUSIC_HOST_PATH:-./music}:/music
      # Mount your downloads/input directory
      - ${DOWNLOADS_HOST_PATH:-./downloads}:/downloads
      # Tidal auth file (optional -- only if using legacy Tidarr config)
      # - /path/to/tiddl/auth.json:/tiddl-auth/auth.json:ro
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:8402/api/spotify/callback}
      - TIDARR_URL=${TIDARR_URL:-http://localhost:8484}  # optional: only for legacy Tidarr fallback
      - LEXICON_API_URL=${LEXICON_API_URL:-http://localhost:48624}
      # The bind mount above still points at the share ROOT so Plex path
      # translation (plex_music_container_prefix=/music) and existing
      # /music/Database/... file_path rows keep resolving. The LIBRARY root
      # is a subdirectory of it -- that is what the worker writes into.
      - MUSIC_LIBRARY_PATH=${MUSIC_LIBRARY_PATH:-/music/Database}
      - SLS_DB_PATH=/app/data/sync.db
      - TIDDL_PATH=/tiddl-config
    depends_on:
      sync-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8403/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  sync-web:
    build:
      context: ./sync-web
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8402}
        - INTERNAL_API_URL=http://sync-api:8402
    image: ${WAXFLOW_REGISTRY:-ghcr.io/rancur}/waxflow-web:${WAXFLOW_IMAGE_TAG:-${VERSION:-latest}}
    container_name: waxflow-web
    ports:
      - "8400:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8402}
      - INTERNAL_API_URL=http://sync-api:8402
    depends_on:
      - sync-api
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Auto-updater. A container cannot replace itself, so applying an update needs
  # host-side Docker access — this is the only place WaxFlow asks for it.
  #
  # SECURITY: the Docker socket is root-equivalent on the host, so this service
  # runs with NO NETWORK. It never downloads anything; the worker (network, no
  # socket) decides what to update to, and the DAEMON fetches the image layers
  # when asked over the socket. Nothing with host-root access talks to the
  # internet. Set WAXFLOW_AUTOUPDATE=0 in .env to disable, or remove the service.
  # ---------------------------------------------------------------------------
  waxflow-updater:
    image: docker:27-cli
    container_name: waxflow-updater
    network_mode: none
    entrypoint: ["/bin/sh", "/updater/waxflow-updater.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/waxflow-updater.sh:/updater/waxflow-updater.sh:ro
      - .:/project:ro
      - sync-data:/data
    environment:
      - WAXFLOW_UPDATE_POLL_SECONDS=${WAXFLOW_UPDATE_POLL_SECONDS:-60}
      - WAXFLOW_HEALTH_TIMEOUT=${WAXFLOW_HEALTH_TIMEOUT:-180}
    restart: unless-stopped
    depends_on:
      - sync-api

volumes:
  sync-data:
